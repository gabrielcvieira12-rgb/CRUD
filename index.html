<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Adicionar tarefa</p>
    <input id="entrada"  type="text" value="teste"/>
    <button  onclick="salvarDados()">Salvar</button>

    <br>
    <p>Tarefa a fazer</p>
    <div id="editar"></div>

    <div>  
        <ul id="resultados"></ul>
    </div>

 
    <script>
        let listaDeTarefas =[];

        // Criar
        function salvarDados () {
            let entrada = document.getElementById("entrada").value;
            let entradaObj = {
                id: index,
                texto: entrada
            };
            index++;
            listaDeTarefas.push(entradaObj);
            
            mostrar();
        };  

        // Ler
        function mostrar () {
            let ul = document.getElementById("resultados");
            let html = "";
            listaDeTarefas.forEach( elemento => {
                html =+`<li>
                    ${elemento.texto}
                    <button  onclick="editar(${elemento.id})">
                        Editar
                    </button>  
                    <button  onclick="deletar(${elemento.id})">
                        Deletar
                    </button>  
                </li>`;
            });

            ul.innerHTML = html

        // Update/editar
        };
        function editar (id) {
            listaDeTarefas.find(obj => obj.id === id);
            let html = `    <input type="text" name="" id="textoParaEditar">
                <button  onclick="editarDados(${id})">Editar</button>`;
            let diveditar = document.getElementById(`editar`);
            diveditar.innerHTML = html;
        };
        function editarDados (id) {
            let textoParaEditar = document.getElementById("textoParaEditar")
            let resultado = listaDeTarefas.find(obj => obj.id === id );
            resultado.texto = textoParaEditar;
            mostrar();
            let diveditar = document.getElementById(`editar`);
            diveditar.innerHTML = html;
        };
        
        // deletar
        function deletar (deletar) {
            let novaLista = listaDeTarefas.filter(obj => obj.id !== id);
            listaDeTarefas = novaLista;
            mostrar();
        };

    </script>
</body>
</html>
